<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrushPC | Montaje y Optimización de PC</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00d4ff;
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --text-light: #ffffff;
            --text-gray: #b3b3b3;
            --tiktok-color: #ff0050;
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; scroll-behavior: smooth; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 10%; background: rgba(0,0,0,0.8); position: fixed; width: 80%; top: 0; z-index: 1000; backdrop-filter: blur(10px); }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary-color); text-transform: uppercase; letter-spacing: 2px; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: 400; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary-color); }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('https://unsplash.com') center/cover; padding: 0 20px; }
        .hero h1 { font-size: 4rem; margin-bottom: 10px; text-transform: uppercase; }
        .hero h1 span { color: var(--primary-color); }
        .hero p { font-size: 1.2rem; color: var(--text-gray); max-width: 600px; margin-bottom: 30px; }
        .btn-cta { background-color: var(--primary-color); color: black; padding: 15px 30px; text-decoration: none; font-weight: bold; border-radius: 50px; transition: 0.3s; text-transform: uppercase; }
        .btn-cta:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--primary-color); }
        .services { padding: 100px 10%; text-align: center; }
        .services h2 { font-size: 2.5rem; margin-bottom: 50px; }
        .services h2 span { color: var(--primary-color); }
        .grid-services { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); padding: 30px; border-radius: 20px; border: 1px solid #333; }
        .card h3 { color: var(--primary-color); margin-bottom: 15px; }
        .projects { padding: 100px 10%; text-align: center; background-color: #0f0f0f; }
        .projects h2 { font-size: 2.5rem; margin-bottom: 15px; }
        .projects h2 span { color: var(--primary-color); }
        .whatsapp-floating { position: fixed; bottom: 30px; right: 30px; background-color: #25D366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 2000; text-decoration: none; font-size: 30px; }
    </style>
</head>
<body>
    <a href="https://wa.me" class="whatsapp-floating" target="_blank">💬</a>
    <nav>
        <div class="logo">DrushPC</div>
        <div class="nav-links">
            <a href="#inicio">Inicio</a>
            <a href="#servicios">Servicios</a>
            <a href="#proyectos">Proyectos</a>
            <a href="#contacto">Contacto</a>
        </div>
    </nav>
    <section class="hero" id="inicio">
        <h1>Drush<span>PC</span></h1>
        <p>Montaje y optimización de hardware profesional.</p>
        <a href="https://wa.me" class="btn-cta" target="_blank">Pedir Presupuesto</a>
    </section>
    <section class="services" id="servicios">
        <h2>Nuestros <span>Servicios</span></h2>
        <div class="grid-services">
            <div class="card"><h3>Asesoría</h3><p>Te ayudo a elegir componentes.</p></div>
            <div class="card"><h3>Montaje</h3><p>Ensamblaje limpio y ordenado.</p></div>
        </div>
    </section>
</body>
</html>
